<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Dohwaji</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="toolbar">
    <div class="identity">
      <strong>Dohwaji</strong>
      <span id="folder-name">Opening folder…</span>
    </div>
    <div class="toolbar-meta">
      <span id="image-count"></span>
      <span id="save-status" role="status" aria-live="polite"></span>
    </div>
  </header>

  <main id="viewport" class="viewport" aria-label="Reference canvas">
    <div id="canvas" class="canvas"></div>
  </main>

  <dialog id="lightbox" class="lightbox" aria-label="Full-size image viewer">
    <div class="lightbox-bar">
      <span id="lightbox-name"></span>
      <div class="lightbox-actions">
        <a id="open-original" target="_blank" rel="noopener">Open original</a>
        <button id="close-lightbox" type="button" aria-label="Close full-size viewer">Close</button>
      </div>
    </div>
    <div class="lightbox-stage">
      <img id="lightbox-image" alt="">
    </div>
  </dialog>

  <template id="image-template">
    <button class="image-tile" type="button">
      <img draggable="false" alt="">
    </button>
  </template>

  <script src="/static/app.js" defer></script>
</body>
</html>
